[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0-beta.6"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"

[workspace.dependencies]
datafusion-sql = { version = "=55.2.0", default-features = false, features = ["unicode_expressions"] }
datafusion-expr = { version = "=55.2.0", default-features = false }
datafusion-common = { version = "=55.2.0", default-features = false }
datafusion-functions = { version = "=55.2.0", default-features = false, features = ["crypto_expressions"] }
datafusion-functions-aggregate = { version = "=55.2.0", default-features = false }
datafusion-functions-window = { version = "=55.2.0", default-features = false }
arrow-schema = "*"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
miette = { version = "7", features = ["fancy"] }
petgraph = "0.8"
rayon = "1"
blake3 = "1"
toml = "0.9"
notify = "8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
insta = { version = "1", features = ["json"] }
proptest = "1"
datafusion = { version = "=55.2.0", default-features = false, features = ["sql", "nested_expressions"] }
tokio = { version = "1", features = ["rt", "macros"] }
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
cardinal-dbt = { path = "crates/cardinal-dbt" }
cardinal-sql = { path = "crates/cardinal-sql" }
cardinal-grain = { path = "crates/cardinal-grain" }
cardinal-check = { path = "crates/cardinal-check" }
cardinal-diag = { path = "crates/cardinal-diag" }
cardinal-cache = { path = "crates/cardinal-cache" }
datafusion-functions-nested = { version = "=55.2.0", default-features = false }
