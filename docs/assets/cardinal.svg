<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Cardinal logo: a red cardinal bird">
  <title>Cardinal</title>
  <!-- tail -->
  <path d="M90 92 L120 114 L110 122 L84 102 Z" fill="#9E0B22"/>
  <!-- body, head and crest -->
  <path d="M36 33
           C 44 23, 58 19, 76 9
           C 70 21, 71 29, 76 36
           C 92 46, 101 62, 101 80
           C 101 98, 86 110, 66 108
           C 50 106, 38 94, 35 78
           C 33 66, 33 56, 35 50
           C 30 44, 31 37, 36 33 Z" fill="#C8102E"/>
  <!-- wing -->
  <path d="M70 54 C 86 57, 97 72, 98 90 C 88 94, 74 86, 66 72 C 62 64, 63 56, 70 54 Z" fill="#9E0B22"/>
  <path d="M74 66 C 82 72, 88 80, 91 88" stroke="#7A0819" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <!-- black mask -->
  <path d="M52 37 C 45 34, 38 35, 33 40 L 33 53 C 38 61, 49 61, 56 52 C 59 46, 58 40, 52 37 Z" fill="#161616"/>
  <!-- beak -->
  <path d="M37 39 C 30 41, 22 44, 16 47 C 22 50, 30 53, 37 55 C 39 50, 39 44, 37 39 Z" fill="#F4A340"/>
  <path d="M16 47 L 37 47.5" stroke="#C97A1E" stroke-width="1.4" stroke-linecap="round"/>
  <!-- eye -->
  <circle cx="47" cy="43" r="3.4" fill="#000"/>
  <circle cx="48.2" cy="41.8" r="1.2" fill="#fff"/>
  <!-- perch -->
  <path d="M30 112 L 104 112" stroke="#6B4A2B" stroke-width="5" stroke-linecap="round"/>
  <path d="M58 106 L 56 112 M64 107 L 64 112" stroke="#3B2A1A" stroke-width="2.4" stroke-linecap="round"/>
</svg>
